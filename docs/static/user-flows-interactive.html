<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anplexa User Flows | Interactive Documentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0e14;
      --bg-secondary: #0d1117;
      --bg-tertiary: #161b22;
      --bg-elevated: #1c2128;
      --border-subtle: #21262d;
      --border-default: #30363d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #484f58;
      --accent-cyan: #00d9ff;
      --accent-cyan-dim: rgba(0, 217, 255, 0.15);
      --accent-purple: #a855f7;
      --accent-purple-dim: rgba(168, 85, 247, 0.15);
      --accent-green: #00ff88;
      --accent-green-dim: rgba(0, 255, 136, 0.15);
      --accent-amber: #ffb800;
      --accent-amber-dim: rgba(255, 184, 0, 0.15);
      --accent-red: #ff4757;
      --accent-red-dim: rgba(255, 71, 87, 0.15);
      --accent-blue: #3b82f6;
      --accent-blue-dim: rgba(59, 130, 246, 0.15);
      --glow-cyan: 0 0 20px rgba(0, 217, 255, 0.4);
      --glow-purple: 0 0 20px rgba(168, 85, 247, 0.4);
      --glow-green: 0 0 20px rgba(0, 255, 136, 0.4);
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Space Grotesk', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 217, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 217, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    .grid-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(0, 217, 255, 0.08) 0%, transparent 60%);
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 14, 20, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 1rem 2rem;
    }

    .header-inner {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--bg-primary);
    }

    .logo-text {
      font-weight: 600;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }

    .logo-text span {
      color: var(--text-secondary);
      font-weight: 400;
      margin-left: 0.5rem;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-green);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.4); }
      50% { opacity: 0.8; box-shadow: 0 0 0 6px rgba(0, 255, 136, 0); }
    }

    .main {
      position: relative;
      z-index: 1;
      max-width: 1600px;
      margin: 0 auto;
      padding: 2rem;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 2rem;
      min-height: calc(100vh - 80px);
    }

    .sidebar {
      position: sticky;
      top: 100px;
      height: fit-content;
    }

    .nav-section { margin-bottom: 2rem; }

    .nav-label {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      padding-left: 1rem;
    }

    .nav-tabs {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .nav-tab {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 500;
      font-family: var(--font-sans);
    }

    .nav-tab:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .nav-tab.active {
      background: var(--accent-cyan-dim);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .nav-tab-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }

    .nav-tab-count {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      background: var(--bg-elevated);
      border-radius: 10px;
      color: var(--text-muted);
    }

    .nav-tab.active .nav-tab-count {
      background: rgba(0, 217, 255, 0.2);
      color: var(--accent-cyan);
    }

    .subflows {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-subtle);
    }

    .subflow-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      font-size: 0.8rem;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .subflow-item:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .subflow-item.active { color: var(--accent-cyan); }

    .subflow-item::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--border-default);
      transition: all 0.2s ease;
    }

    .subflow-item.active::before {
      background: var(--accent-cyan);
      box-shadow: 0 0 8px var(--accent-cyan);
    }

    .content {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .flow-canvas {
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 2rem;
      position: relative;
      overflow: hidden;
      min-height: 500px;
    }

    .flow-canvas::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle at 1px 1px, var(--border-subtle) 1px, transparent 0);
      background-size: 24px 24px;
      opacity: 0.5;
    }

    .flow-header {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 2rem;
    }

    .flow-title {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .flow-description {
      color: var(--text-secondary);
      font-size: 0.9rem;
      max-width: 600px;
      line-height: 1.6;
    }

    .flow-badge {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-default);
      color: var(--text-secondary);
    }

    .sequence-diagram {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .sequence-actors {
      display: flex;
      justify-content: space-around;
      padding-bottom: 1rem;
      border-bottom: 1px dashed var(--border-subtle);
      margin-bottom: 1rem;
    }

    .sequence-actor {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .sequence-actor-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }

    .sequence-actor-name {
      font-size: 0.75rem;
      font-weight: 600;
      text-align: center;
    }

    .sequence-step {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1rem;
      background: var(--bg-elevated);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .sequence-step:hover {
      border-color: var(--border-default);
      transform: translateX(4px);
    }

    .sequence-step.active {
      border-color: var(--accent-cyan);
      background: var(--accent-cyan-dim);
    }

    .sequence-step-number {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--bg-tertiary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      flex-shrink: 0;
    }

    .sequence-step.active .sequence-step-number {
      background: var(--accent-cyan);
      color: var(--bg-primary);
    }

    .sequence-step-content { flex: 1; }

    .sequence-step-action {
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
    }

    .sequence-step-detail {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .sequence-step-arrow {
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .detail-panel {
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      overflow: hidden;
    }

    .detail-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .detail-title {
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .detail-title-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      background: var(--accent-cyan-dim);
      color: var(--accent-cyan);
    }

    .detail-tabs { display: flex; gap: 0.25rem; }

    .detail-tab {
      padding: 0.4rem 0.8rem;
      font-size: 0.75rem;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      font-family: var(--font-sans);
    }

    .detail-tab:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .detail-tab.active {
      background: var(--accent-cyan-dim);
      color: var(--accent-cyan);
    }

    .detail-content { padding: 1.5rem; }

    .detail-section { margin-bottom: 1.5rem; }
    .detail-section:last-child { margin-bottom: 0; }

    .detail-section-title {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    .detail-text {
      font-size: 0.875rem;
      line-height: 1.7;
      color: var(--text-secondary);
    }

    .detail-code {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 1rem;
      overflow-x: auto;
    }

    .detail-code .keyword { color: var(--accent-purple); }
    .detail-code .string { color: var(--accent-green); }

    .detail-list { list-style: none; }

    .detail-list-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border-subtle);
    }

    .detail-list-item:last-child { border-bottom: none; }

    .detail-list-icon {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      flex-shrink: 0;
      margin-top: 0.1rem;
    }

    .detail-list-content { flex: 1; }

    .detail-list-title {
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
    }

    .detail-list-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.25rem 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      border-radius: 4px;
      font-weight: 500;
    }

    .tag.cyan { background: var(--accent-cyan-dim); color: var(--accent-cyan); }
    .tag.purple { background: var(--accent-purple-dim); color: var(--accent-purple); }
    .tag.green { background: var(--accent-green-dim); color: var(--accent-green); }
    .tag.amber { background: var(--accent-amber-dim); color: var(--accent-amber); }
    .tag.red { background: var(--accent-red-dim); color: var(--accent-red); }

    .state-diagram {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      padding: 2rem 0;
      position: relative;
      z-index: 1;
    }

    .state-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem 1.5rem;
      background: var(--bg-elevated);
      border: 2px solid var(--border-default);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
      min-width: 120px;
    }

    .state-node:hover {
      transform: scale(1.05);
      border-color: var(--accent-cyan);
    }

    .state-icon { font-size: 1.5rem; }
    .state-label { font-size: 0.8rem; font-weight: 600; }
    .state-desc { font-size: 0.65rem; color: var(--text-muted); text-align: center; }

    .flow-node-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .flow-node-icon.user { background: var(--accent-blue-dim); color: var(--accent-blue); }
    .flow-node-icon.frontend { background: var(--accent-purple-dim); color: var(--accent-purple); }
    .flow-node-icon.api { background: var(--accent-green-dim); color: var(--accent-green); }
    .flow-node-icon.database { background: var(--accent-amber-dim); color: var(--accent-amber); }
    .flow-node-icon.external { background: var(--accent-red-dim); color: var(--accent-red); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in { animation: fadeIn 0.4s ease forwards; }
    .fade-in-delay-1 { animation-delay: 0.1s; opacity: 0; }
    .fade-in-delay-2 { animation-delay: 0.2s; opacity: 0; }
    .fade-in-delay-3 { animation-delay: 0.3s; opacity: 0; }
    .fade-in-delay-4 { animation-delay: 0.4s; opacity: 0; }

    @media (max-width: 1024px) {
      .main { grid-template-columns: 1fr; }
      .sidebar { position: relative; top: 0; }
      .nav-tabs { flex-direction: row; flex-wrap: wrap; }
      .subflows { display: none; }
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  </style>
</head>
<body>
  <div class="grid-bg"></div>

  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">A</div>
        <div class="logo-text">Anplexa <span>User Flows</span></div>
      </div>
      <div class="header-meta">
        <a href="clean-architecture-transition.html" style="color: var(--accent-purple); text-decoration: none; margin-right: 1rem;">Clean Architecture Plan &rarr;</a>
        <div class="status-indicator">
          <div class="status-dot"></div>
          <span>Documentation v1.0</span>
        </div>
        <span>35 Flows</span>
        <span>5 Categories</span>
      </div>
    </div>
  </header>

  <main class="main">
    <aside class="sidebar">
      <nav class="nav-section">
        <div class="nav-label">Flow Categories</div>
        <div class="nav-tabs" id="mainTabs">
          <button class="nav-tab active" data-tab="auth">
            <span class="nav-tab-icon">🔐</span>
            <span>Authentication</span>
            <span class="nav-tab-count">8</span>
          </button>
          <button class="nav-tab" data-tab="chat">
            <span class="nav-tab-icon">💬</span>
            <span>Chat</span>
            <span class="nav-tab-count">9</span>
          </button>
          <button class="nav-tab" data-tab="subscription">
            <span class="nav-tab-icon">💳</span>
            <span>Subscription</span>
            <span class="nav-tab-count">6</span>
          </button>
          <button class="nav-tab" data-tab="funnel">
            <span class="nav-tab-icon">🎯</span>
            <span>Funnel</span>
            <span class="nav-tab-count">7</span>
          </button>
          <button class="nav-tab" data-tab="data">
            <span class="nav-tab-icon">📊</span>
            <span>Data Flow</span>
            <span class="nav-tab-count">5</span>
          </button>
        </div>
      </nav>
      <div class="subflows" id="subflowsContainer"></div>
    </aside>

    <section class="content">
      <div class="flow-canvas" id="flowCanvas"></div>
      <div class="detail-panel" id="detailPanel"></div>
    </section>
  </main>

  <script>
    const flowData = {
      auth: {
        name: 'Authentication Flows',
        description: 'User identity verification and session management across the platform.',
        flows: [
          {
            id: 'login',
            name: 'Email/Password Login',
            description: 'Standard login flow for returning users with email and password credentials.',
            steps: [
              { actor: 'User', action: 'Click "Login"', detail: 'Opens login modal', type: 'user' },
              { actor: 'UI', action: 'Show login modal', detail: 'Display email/password form', type: 'frontend' },
              { actor: 'User', action: 'Enter credentials', detail: 'email, password', type: 'user' },
              { actor: 'Context', action: 'login(email, password)', detail: 'AuthContext method', type: 'frontend' },
              { actor: 'API', action: 'POST /api/auth/login', detail: 'Proxy to backend', type: 'api' },
              { actor: 'Backend', action: 'Verify password', detail: 'bcrypt.compare()', type: 'api' },
              { actor: 'DB', action: 'Find user by email', detail: 'SELECT * FROM users', type: 'database' },
              { actor: 'Backend', action: 'Generate JWT pair', detail: 'accessToken (15m), refreshToken (7d)', type: 'api' },
              { actor: 'DB', action: 'Store refresh token', detail: 'INSERT INTO sessions', type: 'database' },
              { actor: 'Context', action: 'Store tokens', detail: 'localStorage.setItem()', type: 'frontend' },
              { actor: 'UI', action: 'Close modal, show chat', detail: 'Login success', type: 'frontend' }
            ],
            endpoint: 'POST /api/auth/login',
            request: '{ email: string, password: string }',
            response: '{ accessToken, refreshToken, user }',
            securityNotes: ['Passwords hashed with bcrypt (12 rounds)', 'Rate limited: 10 attempts per 15 min']
          },
          {
            id: 'register',
            name: 'User Registration',
            description: 'New user account creation with email validation and password setup.',
            steps: [
              { actor: 'User', action: 'Click "Create Account"', detail: 'Opens registration form', type: 'user' },
              { actor: 'UI', action: 'Show registration form', detail: 'email, password, confirm', type: 'frontend' },
              { actor: 'UI', action: 'Validate passwords match', detail: 'Client-side validation', type: 'frontend' },
              { actor: 'API', action: 'POST /api/auth/register', detail: 'Create account request', type: 'api' },
              { actor: 'DB', action: 'Check email exists', detail: 'SELECT * FROM users WHERE email', type: 'database' },
              { actor: 'Backend', action: 'Hash password', detail: 'bcrypt.hash(password, 12)', type: 'api' },
              { actor: 'DB', action: 'INSERT user', detail: 'Create new user record', type: 'database' },
              { actor: 'Backend', action: 'Generate JWT pair', detail: 'Auto-login after registration', type: 'api' },
              { actor: 'UI', action: 'Show welcome message', detail: 'Registration complete', type: 'frontend' }
            ],
            endpoint: 'POST /api/auth/register',
            request: '{ email: string, password: string }',
            response: '{ accessToken, refreshToken, user }',
            securityNotes: ['Email uniqueness enforced', 'Rate limited: 5 per hour']
          },
          {
            id: 'refresh',
            name: 'Token Refresh',
            description: 'Automatic token refresh when access token expires (15 minutes).',
            steps: [
              { actor: 'Context', action: 'API call with expired token', detail: 'Authorization: Bearer {expired}', type: 'frontend' },

    let currentTab = 'auth';
    let currentFlow = 0;
    let currentStep = null;

    const mainTabs = document.getElementById('mainTabs');
    const subflowsContainer = document.getElementById('subflowsContainer');
    const flowCanvas = document.getElementById('flowCanvas');
    const detailPanel = document.getElementById('detailPanel');

    function init() {
      renderMainTabs();
      renderSubflows();
      renderFlowCanvas();
      renderDetailPanel();
    }

    function renderMainTabs() {
      mainTabs.querySelectorAll('.nav-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.tab === currentTab);
        tab.onclick = () => {
          currentTab = tab.dataset.tab;
          currentFlow = 0;
          currentStep = null;
          renderMainTabs();
          renderSubflows();
          renderFlowCanvas();
          renderDetailPanel();
        };
      });
    }

    function renderSubflows() {
      const data = flowData[currentTab];
      const flows = data.flows;
      const label = document.createElement('div');
      label.className = 'nav-label';
      label.textContent = data.name;

      subflowsContainer.replaceChildren(label);

      flows.forEach((flow, index) => {
        const item = document.createElement('div');
        item.className = 'subflow-item' + (index === currentFlow ? ' active' : '');
        item.textContent = flow.name;
        item.onclick = () => {
          currentFlow = index;
          currentStep = null;
          renderSubflows();
          renderFlowCanvas();
          renderDetailPanel();
        };
        subflowsContainer.appendChild(item);
      });
    }

    function getActorIcon(type) {
      const icons = { user: '👤', frontend: '🖥️', api: '⚡', database: '💾', external: '🌐' };
      return icons[type] || '📦';
    }

    function getTagClass(type) {
      const classes = { user: 'cyan', frontend: 'purple', api: 'green', database: 'amber', external: 'red' };
      return classes[type] || 'cyan';
    }

    function renderFlowCanvas() {
      const data = flowData[currentTab];
      const flow = data.flows[currentFlow];

      flowCanvas.replaceChildren();

      const header = document.createElement('div');
      header.className = 'flow-header fade-in';

      const headerContent = document.createElement('div');
      const title = document.createElement('h2');
      title.className = 'flow-title';
      title.textContent = flow.name;
      const desc = document.createElement('p');
      desc.className = 'flow-description';
      desc.textContent = flow.description;
      headerContent.appendChild(title);
      headerContent.appendChild(desc);

      const badge = document.createElement('span');
      badge.className = 'flow-badge';
      badge.textContent = flow.states ? flow.states.length + ' States' :
                          flow.personas ? flow.personas.length + ' Personas' :
                          (flow.steps?.length || 0) + ' Steps';

      header.appendChild(headerContent);
      header.appendChild(badge);
      flowCanvas.appendChild(header);

      if (flow.states) {
        const diagram = document.createElement('div');
        diagram.className = 'state-diagram';
        flow.states.forEach(state => {
          const node = document.createElement('div');
          node.className = 'state-node';
          node.innerHTML = '<span class="state-icon">' + state.icon + '</span>' +
                          '<span class="state-label">' + state.name + '</span>' +
                          '<span class="state-desc">' + state.desc + '</span>';
          diagram.appendChild(node);
        });
        flowCanvas.appendChild(diagram);
        return;
      }

      if (flow.personas) {
        const colorMap = { cyan: '--accent-cyan', purple: '--accent-purple', green: '--accent-green', amber: '--accent-amber', red: '--accent-red', blue: '--accent-blue' };
        const diagram = document.createElement('div');
        diagram.className = 'state-diagram';
        flow.personas.forEach(persona => {
          const node = document.createElement('div');
          node.className = 'state-node';
          node.style.borderColor = 'var(' + colorMap[persona.color] + ')';
          node.innerHTML = '<span class="state-label" style="color: var(' + colorMap[persona.color] + ');">Persona ' + persona.id + '</span>' +
                          '<span class="state-icon" style="font-size: 0.9rem;">' + persona.name + '</span>' +
                          '<span class="state-desc">' + persona.desc + '</span>';
          diagram.appendChild(node);
        });
        flowCanvas.appendChild(diagram);
        return;
      }

      const steps = flow.steps || [];
      const actors = [...new Set(steps.map(s => s.actor))];

      const sequenceDiagram = document.createElement('div');
      sequenceDiagram.className = 'sequence-diagram';

      const actorsDiv = document.createElement('div');
      actorsDiv.className = 'sequence-actors';
      actors.slice(0, 6).forEach(actor => {
        const step = steps.find(s => s.actor === actor);
        const iconClass = step ? step.type : 'frontend';
        const actorDiv = document.createElement('div');
        actorDiv.className = 'sequence-actor fade-in';
        actorDiv.innerHTML = '<div class="sequence-actor-icon flow-node-icon ' + iconClass + '">' + getActorIcon(iconClass) + '</div>' +
                            '<span class="sequence-actor-name">' + actor + '</span>';
        actorsDiv.appendChild(actorDiv);
      });
      sequenceDiagram.appendChild(actorsDiv);

      steps.forEach((step, index) => {
        const stepDiv = document.createElement('div');
        stepDiv.className = 'sequence-step fade-in fade-in-delay-' + Math.min((index % 4) + 1, 4) + (currentStep === index ? ' active' : '');
        stepDiv.innerHTML = '<span class="sequence-step-number">' + (index + 1) + '</span>' +
                           '<div class="sequence-step-content">' +
                           '<div class="sequence-step-action">' + step.action + '</div>' +
                           '<div class="sequence-step-detail">' + step.detail + '</div>' +
                           '</div>' +
                           '<span class="sequence-step-arrow">→</span>' +
                           '<span class="tag ' + getTagClass(step.type) + '">' + step.actor + '</span>';
        stepDiv.onclick = () => {
          currentStep = index;
          renderFlowCanvas();
          renderDetailPanel();
        };
        sequenceDiagram.appendChild(stepDiv);
      });

      flowCanvas.appendChild(sequenceDiagram);
    }

    function renderDetailPanel() {
      const data = flowData[currentTab];
      const flow = data.flows[currentFlow];

      detailPanel.replaceChildren();

      const header = document.createElement('div');
      header.className = 'detail-header';
      header.innerHTML = '<div class="detail-title"><div class="detail-title-icon">📋</div>Flow Details</div>' +
                        '<div class="detail-tabs"><button class="detail-tab active">Overview</button><button class="detail-tab">API</button><button class="detail-tab">Security</button></div>';
      detailPanel.appendChild(header);

      const content = document.createElement('div');
      content.className = 'detail-content';

      if (currentStep !== null && flow.steps) {
        const step = flow.steps[currentStep];
        const section = document.createElement('div');
        section.className = 'detail-section';
        section.innerHTML = '<div class="detail-section-title">Current Step</div>' +
                           '<div class="detail-text"><strong>Step ' + (currentStep + 1) + ':</strong> ' + step.action + '<br>' +
                           '<strong>Actor:</strong> ' + step.actor + '<br>' +
                           '<strong>Detail:</strong> ' + step.detail + '</div>';
        content.appendChild(section);
      }

      const endpointSection = document.createElement('div');
      endpointSection.className = 'detail-section';
      endpointSection.innerHTML = '<div class="detail-section-title">Endpoint</div>' +
                                 '<div class="detail-code">' + (flow.endpoint || 'N/A') + '</div>';
      content.appendChild(endpointSection);

      if (flow.request) {
        const reqSection = document.createElement('div');
        reqSection.className = 'detail-section';
        reqSection.innerHTML = '<div class="detail-section-title">Request</div>' +
                              '<div class="detail-code"><span class="keyword">Request:</span> ' + flow.request + '</div>';
        content.appendChild(reqSection);
      }

      if (flow.response) {
        const resSection = document.createElement('div');
        resSection.className = 'detail-section';
        resSection.innerHTML = '<div class="detail-section-title">Response</div>' +
                              '<div class="detail-code"><span class="string">Response:</span> ' + flow.response + '</div>';
        content.appendChild(resSection);
      }

      if (flow.securityNotes) {
        const secSection = document.createElement('div');
        secSection.className = 'detail-section';
        let listHtml = '<div class="detail-section-title">Security Notes</div><ul class="detail-list">';
        flow.securityNotes.forEach(note => {
          listHtml += '<li class="detail-list-item"><div class="detail-list-icon flow-node-icon api">🔒</div>' +
                     '<div class="detail-list-content"><div class="detail-list-desc">' + note + '</div></div></li>';
        });
        listHtml += '</ul>';
        secSection.innerHTML = listHtml;
        content.appendChild(secSection);
      }

      if (flow.tables) {
        const tablesSection = document.createElement('div');
        tablesSection.className = 'detail-section';
        let listHtml = '<div class="detail-section-title">Database Tables</div><ul class="detail-list">';
        flow.tables.forEach(table => {
          listHtml += '<li class="detail-list-item"><div class="detail-list-icon flow-node-icon database">📊</div>' +
                     '<div class="detail-list-content"><div class="detail-list-title">' + table.name + '</div>' +
                     '<div class="detail-list-desc">' + table.fields + '</div></div></li>';
        });
        listHtml += '</ul>';
        tablesSection.innerHTML = listHtml;
        content.appendChild(tablesSection);
      }

      if (flow.contracts) {
        const contractsSection = document.createElement('div');
        contractsSection.className = 'detail-section';
        let listHtml = '<div class="detail-section-title">API Contracts</div><ul class="detail-list">';
        flow.contracts.forEach(contract => {
          listHtml += '<li class="detail-list-item"><div class="detail-list-icon flow-node-icon api">⚡</div>' +
                     '<div class="detail-list-content"><div class="detail-list-title">' + contract.endpoint + '</div>' +
                     '<div class="detail-list-desc">In: ' + contract.request + ' → Out: ' + contract.response + '</div></div></li>';
        });
        listHtml += '</ul>';
        contractsSection.innerHTML = listHtml;
        content.appendChild(contractsSection);
      }

      detailPanel.appendChild(content);
    }

    init();
  </script>
</body>
</html>
