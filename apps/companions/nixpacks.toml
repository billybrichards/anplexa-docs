# Railway nixpacks configuration for @anplexa/companions
# This file is used when Railway deploys from monorepo root

[phases.setup]
nixPkgs = ["nodejs_20", "pnpm"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
# Build only companions and its dependencies (not docs which may have different Node requirements)
cmds = ["pnpm build --filter=@anplexa/companions..."]

[start]
# Run Next.js from the apps/companions directory
cmd = "cd apps/companions && pnpm start"
