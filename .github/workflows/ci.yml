name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Unit Tests, Lint, Typecheck, Build ──────────────────────────────────
  quality:
    name: Lint → Typecheck → Test → Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

  # ── Playwright E2E (only on develop, after quality passes) ─────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
    timeout-minutes: 10
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://companions-develop.up.railway.app' }}
      E2E_API_URL: ${{ vars.E2E_API_URL || 'https://api-develop-f1bc.up.railway.app' }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests (sign-in + chat)
        run: npx playwright test e2e/02-signin.spec.ts e2e/03-chat.spec.ts --project=mobile-portrait --reporter=list

      # Onboarding test is slower (~2 min) — run separately, allow failure for now
      - name: Run E2E tests (onboarding)
        run: npx playwright test e2e/01-onboarding.spec.ts --project=mobile-portrait --reporter=list
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
