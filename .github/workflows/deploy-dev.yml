name: Deploy to Development

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false  # Don't cancel mid-deploy

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  deploy:
    name: Deploy All Services
    runs-on: ubuntu-latest
    environment:
      name: development
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Verify Railway auth
        run: railway whoami

      - name: Link to Railway Development project
        run: railway link --project ${{ secrets.RAILWAY_DEV_PROJECT_ID }}

      - name: Deploy API
        run: cd apps/api && railway up --service api --environment development --ci

      - name: Deploy Companions
        run: cd apps/companions && railway up --service companions --environment development --ci

      - name: Deploy Funnel
        run: cd apps/funnel && railway up --service funnel --environment development --ci

      - name: Deploy Docs
        run: cd apps/docs && railway up --service docs --environment development --ci
        continue-on-error: true  # Docs non-critical

      - name: Deployment summary
        if: always()
        run: |
          echo "====================================="
          echo "Development deploy: ${{ job.status }}"
          echo "====================================="
