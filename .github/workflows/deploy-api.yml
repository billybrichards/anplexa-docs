name: Deploy API

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/api/**"
      - "packages/**"

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  deploy-dev:
    if: github.ref == "refs/heads/develop"
    runs-on: ubuntu-latest
    environment:
      name: development
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      
      - run: pnpm install --frozen-lockfile
      
      - run: pnpm build --filter=api
      
      - run: pnpm test --filter=api
      
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      
      - name: Deploy to Railway (Development)
        run: |
          railway link --project ${{ secrets.RAILWAY_DEV_PROJECT_ID }}
          railway up --service api --environment development --ci

  deploy-prod:
    if: github.ref == "refs/heads/main"
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      
      - run: pnpm install --frozen-lockfile
      
      - run: pnpm build --filter=api
      
      - run: pnpm test --filter=api
      
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      
      - name: Deploy to Railway (Production)
        run: |
          railway link --project ${{ secrets.RAILWAY_PROD_PROJECT_ID }}
          railway up --service api --environment production --ci
      
      - name: Post-Deployment Notification
        if: success()
        run: echo "API deployed successfully to Production"
